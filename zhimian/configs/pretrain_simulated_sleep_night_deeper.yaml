run:
  stage: pretrain
  experiment_name: simulated_sleep_night_u001_deeper
  output_root: outputs
  seed: 20240611
  device: cpu
  num_workers: 0
  deterministic: true

dataset:
  kind: simulated_sleep_night
  root_dir: data/raw/simulated_sleep_night_u001
  signal_length: 60
  temp_seq_len: 16
  temp_grid_size: 9
  num_classes: 6
  train_split_ratio: 0.7

preprocessing:
  signal_standardize: true
  temp_standardize: true

model:
  bcg_encoder:
    hidden_channels: 32
    output_dim: 128
    num_blocks: 3
    kernel_size: 5
    dropout: 0.10
  temp_encoder:
    hidden_dim: 64
    output_dim: 64
    dropout: 0.10
  fusion:
    hidden_dim: 128
    output_dim: 128
    dropout: 0.10
  heads:
    num_classes: 6
  uncertainty:
    enabled: true

optimization:
  batch_size: 8
  epochs: 15
  learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  cls_loss_weight: 1.0
  hr_loss_weight: 0.05
  rr_loss_weight: 0.05

checkpoint:
  monitor: val/total_loss
  mode: min
  save_best_filename: best.pt
  save_config_filename: best_config.yaml
