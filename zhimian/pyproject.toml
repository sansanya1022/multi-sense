[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhimian"
version = "0.1.0"
description = "Zhimian sleep monitoring ML scaffold"
requires-python = ">=3.11"
dependencies = [
  "omegaconf>=2.3.0",
  "torch>=2.2.0",
  "tensorboard>=2.16.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

